<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>DNA — major arcs for Roxane / Sara</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
  :root {
    /* Palette: cream ground + blob accents (warm retro) */
    --bg: #f9f4e8;
    --bg-soft: #fffdf8;
    --ink: #2c2824;
    --ink-soft: #5a524c;
    --ink-mute: #887e74;
    --rule: #e3d9c8;
    --line: #3d6d7a;
    --substop: #8fb4c4;
    --roxane: #e8685a;
    --sara: #d95e9a;
    --both: #2c7a8b;
    --topbar-bg: #265f6d;
    --topbar-muted: #c1e1ec;
    --spine-x: 96px;
    --spine-w: 6px;
    --sans: "Inter", "Helvetica Neue", Helvetica, Arial, sans-serif;
    --legend-panel-right: 28px;
  }
  * { box-sizing: border-box; }
  html {
    background: var(--bg);
    scrollbar-gutter: stable;
  }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 14px;
    line-height: 1.4;
    -webkit-font-smoothing: antialiased;
  }
  a { color: inherit; text-decoration: none; }
  a:hover { text-decoration: underline; }

  .topbar {
    position: sticky;
    top: 0;
    z-index: 5;
    background: var(--topbar-bg);
    color: #fff;
    padding: 14px 24px;
    display: flex;
    align-items: center;
    gap: 18px;
    box-shadow: 0 2px 0 rgba(44, 122, 139, 0.25);
  }
  .brand { display: inline-flex; align-items: center; gap: 10px; font-weight: 800; font-size: 18px; letter-spacing: -0.01em; }
  .brand-icon {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 32px;
    height: 32px;
    background: var(--bg-soft);
    color: var(--ink);
    border-radius: 50%;
    font-weight: 800;
    font-size: 17px;
  }
  .brand-strap { color: var(--topbar-muted); font-weight: 400; font-size: 13px; opacity: 0.92; }
  .topbar-spacer { flex: 1; }
  .lang-picker {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-size: 11px;
    color: var(--topbar-muted);
    text-transform: uppercase;
    letter-spacing: 0.12em;
    opacity: 0.95;
  }
  .topbar-credit {
    font-size: 12px;
    font-weight: 500;
    color: var(--topbar-muted);
    opacity: 0.95;
    white-space: nowrap;
    flex-shrink: 0;
  }
  .topbar-credit a {
    color: inherit;
    text-decoration: none;
    border-bottom: 1px solid rgba(193, 225, 236, 0.35);
  }
  .topbar-credit a:hover {
    color: #fff;
    border-bottom-color: rgba(255, 255, 255, 0.55);
  }
  .lang-picker select {
    font-family: var(--sans);
    font-size: 12px;
    padding: 4px 24px 4px 8px;
    border: 1px solid rgba(193, 225, 236, 0.35);
    border-radius: 4px;
    background: #1f4e59 url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='10' viewBox='0 0 10 10'><path fill='%23ffffff' d='M2 4l3 3 3-3z'/></svg>") no-repeat right 6px center;
    color: #fff;
    cursor: pointer;
    appearance: none;
    -webkit-appearance: none;
  }

  .container { max-width: 1100px; margin: 0 auto; padding: 28px 24px 80px; padding-right: 340px; }
  @media (max-width: 980px) {
    .container { padding-right: 24px; }
  }

  .panel-title {
    font-size: 11px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--ink-mute);
    font-weight: 700;
    margin: 0 0 12px;
  }

  .map {
    position: relative;
    margin-top: 4px;
    background: var(--bg-soft);
    border: 1px solid var(--rule);
    border-radius: 8px;
    padding: 0;
    overflow: hidden;
  }

  .row {
    position: relative;
    display: grid;
    grid-template-columns: 96px 1fr;
    align-items: start;
    min-height: 0;
  }
  /* The continuous vertical line behind the markers — always charcoal */
  .row::before {
    content: "";
    position: absolute;
    left: var(--spine-x);
    top: 0;
    bottom: 0;
    width: var(--spine-w);
    background: var(--line);
    transform: translateX(-50%);
    z-index: 0;
  }
  .row.row-first::before { top: 50%; }
  .row.row-last::before { bottom: 50%; }
  /* Marker centered on spine (right edge of column = spine axis) */
  .row .marker-cell {
    position: relative;
    z-index: 1;
    align-self: start;
    padding: 0;
    min-height: 1px;
  }

  /* Substop tick — horizontal bar, centered on spine */
  .station-marker {
    position: absolute;
    right: 0;
    z-index: 2;
    transform: translateX(50%);
    width: 22px;
    height: 5px;
    background: var(--substop);
    border-radius: 2px;
    top: 18px;
  }
  /* Major station — disc centered on spine, aligned with title row */
  .station-marker.is-major {
    width: 22px;
    height: 22px;
    border-radius: 50%;
    background: var(--role, var(--line));
    border: 3px solid var(--bg-soft);
    box-shadow: 0 0 0 2px var(--role, var(--line));
    top: 12px;
  }

  .station-info {
    padding: 12px 24px 12px 36px;
    display: flex;
    align-items: baseline;
    column-gap: 10px;
    row-gap: 2px;
    flex-wrap: wrap;
  }
  .station-id {
    font-weight: 700;
    font-size: 11px;
    color: #fff;
    background: var(--bc, var(--ink-mute));
    padding: 3px 8px;
    border-radius: 4px;
    letter-spacing: 0.04em;
    line-height: 1.4;
    flex-shrink: 0;
  }
  .station-name { font-weight: 600; font-size: 15px; color: var(--ink); }
  .station-meta {
    font-size: 11px;
    color: var(--ink-mute);
    margin: 0;
    letter-spacing: 0.02em;
    line-height: 1.35;
  }
  .station-foot {
    flex-basis: 100%;
    width: 100%;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px 12px;
    margin-top: 0;
    padding-top: 0;
  }
  .readmore-chip {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    margin: 0;
    padding: 5px 12px;
    border-radius: 999px;
    border: 1px solid var(--rule);
    background: linear-gradient(180deg, var(--bg-soft) 0%, var(--bg) 100%);
    box-shadow: 0 1px 0 rgba(255, 255, 255, 0.65);
    font-family: inherit;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.07em;
    text-transform: uppercase;
    color: var(--ink-soft);
    cursor: pointer;
    line-height: 1.2;
    flex-shrink: 0;
  }
  .readmore-chip::after {
    content: "›";
    font-size: 12px;
    font-weight: 800;
    opacity: 0.55;
    transform: translateY(-0.5px);
  }
  .readmore-chip:hover {
    border-color: var(--both);
    color: var(--both);
    background: linear-gradient(180deg, #fff 0%, rgba(44, 122, 139, 0.07) 100%);
  }
  .readmore-chip:focus-visible {
    outline: 2px solid var(--both);
    outline-offset: 2px;
  }
  .station-meta--block {
    flex-basis: 100%;
    width: 100%;
    margin-top: 0;
  }
  .arc-event-note {
    flex-basis: 100%;
    width: 100%;
    margin-top: 8px;
    padding: 8px 11px;
    border-radius: 8px;
    background: rgba(232, 222, 206, 0.45);
    font-size: 12.5px;
    font-weight: 500;
    color: var(--ink);
    line-height: 1.45;
  }
  .arc-event-note-emoji {
    margin-right: 0.35em;
    font-style: normal;
    font-weight: 600;
    white-space: normal;
  }
  .arc-event-note-ep {
    font-weight: 500;
    font-size: 11px;
    color: var(--ink-mute);
  }
  /* Substop rows — quieter typography & outlined chip */
  .row.is-substop .station-info { padding-top: 10px; padding-bottom: 10px; }
  .row.is-substop .station-name { font-weight: 500; font-size: 13.5px; color: var(--ink-soft); }
  .row.is-substop .station-id {
    background: transparent;
    color: var(--ink-mute);
    border: 1px solid var(--rule);
    padding: 2px 7px;
    font-size: 10px;
  }
  .row.is-substop .station-meta { color: var(--ink-mute); opacity: 0.85; }
  .role-badge {
    display: inline-flex;
    align-items: center;
    height: 18px;
    padding: 0 7px;
    border-radius: 999px;
    font-size: 10px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: #fff;
    background: var(--role);
  }

  /* Season banner — full-width colour strip + badge (reference: transit header cards) */
  .season-banner {
    position: relative;
    display: grid;
    grid-template-columns: 96px 1fr;
    align-items: center;
    gap: 0;
    padding: 16px 18px 16px 0;
    margin-top: 10px;
    background: var(--bc, var(--ink-mute));
    border-radius: 10px 10px 0 0;
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.22);
  }
  .season-banner:first-child {
    margin-top: 0;
    border-radius: 7px 7px 0 0;
  }
  .season-banner .marker-cell {
    position: relative;
    align-self: stretch;
    min-height: 52px;
  }
  /* Badge vertically aligned with season title (not the eyebrow / STATION line) */
  .season-banner .banner-badge {
    top: calc(50% + 0px);
    transform: translate(50%, -50%);
  }
  .banner-badge {
    position: absolute;
    right: 0;
    top: 50%;
    z-index: 2;
    transform: translate(50%, -50%);
    width: 44px;
    height: 44px;
    border-radius: 50%;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    box-sizing: border-box;
    background: linear-gradient(165deg, #fffdf8 0%, #fef6e4 55%, #f8ebd4 100%);
    border: 2px solid rgba(255, 255, 255, 0.95);
    box-shadow: 0 2px 8px rgba(42, 36, 36, 0.18);
  }
  .banner-badge-inner {
    position: relative;
    z-index: 1;
    font-weight: 800;
    font-size: 15px;
    line-height: 1;
    color: #2c2824;
    letter-spacing: -0.03em;
  }
  .banner-info {
    padding: 0 22px 0 28px;
  }
  .banner-eyebrow {
    font-size: 10px;
    letter-spacing: 0.26em;
    text-transform: uppercase;
    color: rgba(255, 255, 255, 0.82);
    font-weight: 700;
    text-shadow: 0 1px 2px rgba(42, 36, 36, 0.18);
  }
  .banner-title {
    margin-top: 4px;
    font-size: 23px;
    font-weight: 800;
    color: #fff;
    letter-spacing: -0.02em;
    line-height: 1.15;
    text-shadow: 0 2px 4px rgba(42, 36, 36, 0.22);
  }
  .banner-meta {
    margin-top: 6px;
    font-size: 12px;
    font-weight: 500;
    color: rgba(255, 255, 255, 0.92);
    letter-spacing: 0.03em;
    text-shadow: 0 1px 2px rgba(42, 36, 36, 0.18);
  }

  /* Interchange (milestone) row */
  .interchange {
    position: relative;
    display: grid;
    grid-template-columns: 96px 1fr;
    align-items: start;
    min-height: 0;
    background: rgba(44, 122, 139, 0.055);
  }
  .interchange::before {
    content: "";
    position: absolute;
    left: var(--spine-x);
    top: 0;
    bottom: 0;
    width: var(--spine-w);
    background: var(--line);
    transform: translateX(-50%);
    z-index: 0;
  }
  .interchange .marker-cell {
    position: relative;
    align-self: start;
    padding: 0;
    min-height: 1px;
  }
  .interchange-marker {
    position: absolute;
    right: 0;
    z-index: 2;
    transform: translateX(50%);
    top: 16px;
    width: 40px;
    height: 40px;
    border-radius: 11px;
    background: var(--mc, var(--ink));
    border: 1px solid rgba(255, 255, 255, 0.38);
    color: #fff;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 17px;
    font-weight: 700;
    line-height: 1;
    box-shadow:
      0 4px 14px rgba(42, 36, 36, 0.14),
      0 2px 5px rgba(42, 36, 36, 0.08),
      inset 0 1px 0 rgba(255, 255, 255, 0.22);
  }
  .interchange-info {
    padding: 14px 24px 14px 36px;
  }
  .interchange-eyebrow {
    font-size: 10px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--mc, var(--ink-mute));
    font-weight: 800;
  }
  .interchange-title {
    font-size: 18px;
    font-weight: 700;
    color: var(--ink);
    margin-top: 2px;
  }
  .interchange-meta {
    font-size: 11px;
    color: var(--ink-mute);
    margin-top: 2px;
  }

  .legend-panel {
    position: fixed;
    top: 80px;
    right: var(--legend-panel-right);
    width: 296px;
    max-height: calc(100vh - 100px);
    background: var(--bg-soft);
    border: 1px solid var(--rule);
    border-radius: 12px;
    box-shadow: 0 10px 28px rgba(42, 36, 36, 0.07);
    z-index: 4;
    display: flex;
    flex-direction: column;
    transition: transform 0.32s cubic-bezier(0.4, 0, 0.2, 1);
  }
  .legend-panel.is-collapsed {
    transform: translateX(calc(100% + var(--legend-panel-right)));
  }
  .legend-toggle {
    position: absolute;
    left: -44px;
    top: 20px;
    width: 44px;
    height: 72px;
    background: var(--bg-soft);
    border: 1px solid var(--rule);
    border-right: none;
    border-radius: 10px 0 0 10px;
    cursor: pointer;
    color: var(--ink);
    font-family: var(--sans);
    font-weight: 700;
    font-size: 22px;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: -4px 0 14px rgba(42, 36, 36, 0.06);
    padding: 0;
    line-height: 1;
  }
  .legend-toggle:hover { background: #f2ead9; }
  .legend-chevron {
    display: inline-block;
    transition: transform 0.32s cubic-bezier(0.4, 0, 0.2, 1);
    transform-origin: center;
  }
  .legend-panel.is-collapsed .legend-chevron { transform: rotate(180deg); }
  .legend-head {
    padding: 14px 18px 12px;
    border-bottom: 1px solid var(--rule);
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-shrink: 0;
  }
  .legend-head h3 {
    margin: 0;
    font-size: 12px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--ink);
    font-weight: 800;
  }
  .legend-body {
    padding: 14px 18px 18px;
    overflow-y: auto;
    flex: 1;
  }
  .legend-section { margin-bottom: 18px; }
  .legend-section:last-child { margin-bottom: 0; }
  .legend-section-title {
    font-size: 10px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--ink-mute);
    font-weight: 700;
    margin-bottom: 8px;
  }
  .legend-list { display: flex; flex-direction: column; gap: 8px; }
  .legend-item {
    display: grid;
    grid-template-columns: 32px 1fr;
    align-items: center;
    gap: 10px;
    font-size: 12px;
    color: var(--ink);
    line-height: 1.3;
  }
  .legend-marker-cell { display: flex; align-items: center; justify-content: center; }
  .legend-tick { display: inline-block; width: 22px; height: 5px; border-radius: 2px; background: var(--substop); }
  .legend-disc { display: inline-block; width: 18px; height: 18px; border-radius: 50%; background: currentColor; border: 2px solid var(--bg-soft); box-shadow: 0 0 0 2px currentColor; }
  .legend-icon {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 26px;
    height: 26px;
    border-radius: 7px;
    background: var(--mi, var(--ink-mute));
    color: #fff;
    font-size: 12px;
    font-weight: 700;
    line-height: 1;
    box-shadow:
      0 2px 8px rgba(42, 36, 36, 0.1),
      0 1px 3px rgba(42, 36, 36, 0.06),
      inset 0 1px 0 rgba(255, 255, 255, 0.22);
    border: 1px solid rgba(255, 255, 255, 0.35);
  }
  .legend-line-badge {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 24px;
    height: 24px;
    border-radius: 50%;
    background: currentColor;
    font-weight: 800;
    font-size: 11px;
  }
  .legend-line-badge span { color: #fff; }
  .legend-meta { display: block; font-size: 10px; color: var(--ink-mute); margin-top: 1px; letter-spacing: 0.04em; }
  @media (max-width: 980px) {
    :root { --legend-panel-right: 18px; }
    .legend-panel {
      top: auto;
      bottom: 16px;
      right: var(--legend-panel-right);
      width: 260px;
      max-height: 60vh;
    }
    .legend-toggle { top: 16px; }
  }

  /* Arc synopsis overlay */
  .synopsis-modal {
    position: fixed;
    inset: 0;
    z-index: 30;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: max(20px, env(safe-area-inset-top)) max(20px, env(safe-area-inset-right)) max(20px, env(safe-area-inset-bottom)) max(20px, env(safe-area-inset-left));
  }
  .synopsis-modal[hidden] { display: none; }
  .synopsis-modal-backdrop {
    position: absolute;
    inset: 0;
    background: rgba(44, 40, 36, 0.42);
    cursor: pointer;
  }
  .synopsis-sheet {
    position: relative;
    width: 100%;
    max-width: 580px;
    max-height: min(82vh, 680px);
    overflow: hidden;
    display: flex;
    flex-direction: column;
    background: var(--bg-soft);
    border: 1px solid var(--rule);
    border-radius: 14px;
    box-shadow: 0 20px 50px rgba(42, 36, 36, 0.18);
  }
  .synopsis-sheet-head {
    flex-shrink: 0;
    padding: 16px 18px 12px;
    border-bottom: 1px solid var(--rule);
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 12px;
  }
  .synopsis-sheet-title {
    margin: 0;
    font-size: 20px;
    font-weight: 800;
    letter-spacing: -0.02em;
    color: var(--ink);
    line-height: 1.25;
    padding-right: 8px;
  }
  .synopsis-close {
    flex-shrink: 0;
    font-family: var(--sans);
    font-size: 12px;
    font-weight: 700;
    padding: 8px 14px;
    border-radius: 8px;
    border: 1px solid var(--rule);
    background: var(--bg);
    color: var(--ink-soft);
    cursor: pointer;
  }
  .synopsis-close:hover { background: #f2ead9; color: var(--ink); }
  .synopsis-sheet-body {
    padding: 16px 18px 20px;
    overflow-y: auto;
    font-size: 14px;
    line-height: 1.55;
    color: var(--ink-soft);
    display: flex;
    flex-direction: column;
    gap: 0;
  }
  .synopsis-blurb {
    white-space: pre-wrap;
    margin: 0;
  }
  .synopsis-blurb:empty { display: none; }
  .synopsis-blurb:empty + .synopsis-extra .appear-section {
    margin-top: 0;
    padding-top: 0;
    border-top: none;
  }
  .synopsis-extra:empty { display: none; }
  /* Episode appearance matrix (per arc, optional) */
  .appear-section {
    margin-top: 18px;
    padding-top: 18px;
    border-top: 1px dashed var(--rule);
  }
  .appear-section-title {
    font-size: 11px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    font-weight: 800;
    color: var(--ink-mute);
    margin: 0 0 10px;
  }
  .appear-scroll {
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    padding-bottom: 6px;
    margin: 0 -2px;
  }
  .appear-grid {
    display: grid;
    gap: 6px 5px;
    align-items: center;
    min-width: min-content;
    grid-template-columns: 58px repeat(var(--appear-cols, 20), minmax(17px, 22px));
  }
  .appear-corner {
    min-height: 18px;
  }
  .appear-ep-head {
    font-size: 9px;
    font-weight: 800;
    color: var(--ink-mute);
    text-align: center;
    line-height: 1.15;
    letter-spacing: -0.03em;
  }
  .appear-row-label {
    font-size: 11px;
    font-weight: 800;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    white-space: nowrap;
  }
  .appear-row-label--sara { color: var(--sara); }
  .appear-row-label--roxane { color: var(--roxane); }
  .appear-cell {
    width: 100%;
    aspect-ratio: 1;
    max-height: 24px;
    border-radius: 6px;
    border: 1px solid var(--rule);
    box-sizing: border-box;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    min-width: 0;
    min-height: 0;
  }
  .appear-cell__kiss {
    display: flex;
    align-items: center;
    justify-content: center;
    line-height: 0;
    pointer-events: none;
    background: transparent;
  }
  .appear-cell__kiss-svg {
    display: block;
    width: 14px;
    height: 14px;
    background: transparent !important;
    border: none;
    box-shadow: none;
  }
  .appear-cell__kiss-svg * {
    stroke: none;

const ARC_SYNOPSES = {
  "6-73": {
    fr: "Intrigue catastrophe 💥\n\nPour Noël, Roxane offre à Sara un stage de pilotage ; l'avion s'écrase sur la plage de Sète. Sara est gravement blessée et plongée dans le coma. Manon, Jack, Sylvain et d'autres sont blessés sur la plage ; le pilote Jean-Charles Leduc meurt. Georges découvre qu'un drone piraté a fait chuter l'avion — lien avec Psychose · Crash et le passé d'Aurélie Doumergue.\n\nÉpisode par épisode : la maternité est piratée et coupe le courant ; Roxane remonte à Melissa ; Aurore craint qu'on en veuille à Roxane. Roxane somme Melissa de les laisser tranquilles ; Aurore arrive et Melissa s'enfuit. Lisa suspecte Roxane en tant que hacker ; Melissa affiche sur les écrans du commissariat le masque de la peste des vidéos de menace. David revient ; Sara sort du coma. David est entendu au commissariat ; Aurore apprend que Roxane l'avait croisé sans le lui dire — elles se disputent ; le dispositif pour coincer Melissa échoue. Roxane s'ouvre à Bart : elle est Aurélie. Lisa insiste sur Aurélie ; Roxane trouve un brouilleur dans la voiture de Bart et lui raconte tout ; dispute puis réconciliation ; Melissa enlève David ; Aurore évoque un possible test ADN au juge. Sara veut que Roxane fuie ; Roxane préfère avouer ; Melissa pirate les feux et retient David ; Roxane se rend quand même au commissariat ; David arrive blessé, dit avoir tué Aurélie et oriente la version vers Melissa. Son récit détourne l'enquête de Roxane ; Aurore lui dit qu'il est très malade ; Lisa insiste pour l'ADN sur les restes de Melissa ; Aurore demande à Roxane et Sara d'échanger les prélèvements au labo. Le stratagème fonctionne : le profil cadre avec Aurélie, l'affaire est classée ; avec Aurore, Roxane est définitivement hors de danger.",
    en: "Disaster arc 💥\n\nFor Christmas Roxane gives Sara a flying lesson; the touring plane crashes on the beach at Sète. Sara is badly hurt, in an induced coma. Manon, Jack, Sylvain and others are injured on the beach too; pilot Jean-Charles Leduc dies. Georges learns a hacked drone brought the plane down—tying this to Psychose · Crash and Roxane’s past as Aurélie Doumergue.\n\nEpisode by episode: The maternity unit is hacked and loses power; Roxane traces it to Melissa and Aurore fears Roxane is a target. Roxane tells Melissa to back off; Aurore arrives and Melissa escapes. Lisa suspects Roxane as the hacker; Melissa puts the plague mask from Aurélie’s threat videos on the station screens. David is back in town; Sara wakes from her coma. David is questioned at the station; Aurore learns Roxane saw him without telling her—they argue; the Melissa sting fails. Roxane confesses to Bart that she is Aurélie. Lisa keeps pushing the Aurélie angle; Roxane finds a jammer in Bart’s car and tells him everything; they fight and reconcile; Melissa abducts David; Aurore warns Lisa may seek a court DNA order. Sara wants Roxane to leave the country; Roxane would rather confess; Melissa hacks the traffic lights and holds David; Roxane still goes to the station; a hurt David says he killed Aurélie and pins it on Melissa. His story shifts the case away from Roxane; Aurore tells Roxane he is seriously ill; Lisa still wants DNA from Melissa’s remains; Aurore asks Roxane and Sara to swap the lab samples. The swap works—the profile matches Aurélie, the case is closed, and with Aurore’s help Roxane is safe for good.",
    es: "Intriga catástrofe 💥\n\nEn Navidad Roxane regala a Sara una clase de vuelo; el avión turístico se estrella en la playa de Sète. Sara queda grave y en coma inducido. Manon, Jack, Sylvain y otros resultan heridos en la playa; muere el piloto Jean-Charles Leduc. Georges descubre que un dron pirateado derribó el avión: vínculo con Psychose · Crash y el pasado de Roxane como Aurélie Doumergue.\n\nEpisodio a episodio: hackean la maternidad y se va la luz; Roxane lo rastrea hasta Melissa; Aurore teme que vayan a por Roxane. Roxane exige a Melissa que las deje en paz; llega Aurore y Melissa escapa. Lisa sospecha de Roxane como hacker; Melissa pone en las pantallas de la comisaría la máscara de la peste de los vídeos amenazantes. David vuelve; Sara despierta del coma. Interrogan a David; Aurore descubre que Roxane lo vio y no se lo dijo—discuten; el plan contra Melissa falla. Roxane le confiesa a Bart que es Aurélie. Lisa sigue con Aurélie; Roxane halla un inhibidor en el coche de Bart y se lo cuenta todo; discuten y reconcilian; Melissa se lleva a David; Aurore avisa de posible ADN judicial. Sara quiere que Roxane huya; Roxane prefiere confesarse; Melissa hackea los semáforos y retiene a David; Roxane va a la comisaría; David llega herido, dice que mató a Aurélie y culpa a Melissa. Su relato aparta la investigación de Roxane; Aurore le dice a Roxane que él está muy enfermo; Lisa sigue pidiendo ADN de los restos de Melissa; Aurore pide intercambiar las muestras del laboratorio. El cambio funciona: el perfil encaja con Aurélie, el caso se archiva; con Aurore, Roxane queda a salvo.",
    pt: "Intriga catástrofe 💥\n\nNo Natal Roxane oferece a Sara uma aula de voo; o avião turístico cai na praia de Sète. Sara fica gravemente ferida em coma induzido. Manon, Jack, Sylvain e outros ficam feridos na praia; o piloto Jean-Charles Leduc morre. Georges descobre que um drone pirateado derrubou o avião — ligação a Psychose · Crash e ao passado de Roxane como Aurélie Doumergue.\n\nEpisódio a episódio: a maternidade é hackeada e fica sem luz; Roxane segue o rasto até Melissa; Aurore receia que Roxane seja alvo. Roxane manda Melissa afastar-se; Aurore chega e Melissa foge. Lisa suspeita de Roxane como hacker; Melissa exibe nos ecrãs da esquadra a máscara da peste dos vídeos de ameaça. David volta; Sara acorda do coma. David é ouvido; Aurore fica a saber que Roxane o viu sem lhe contar — discutem; a cilada a Melissa falha. Roxane confessa a Bart que é a Aurélie. Lisa insiste na Aurélie; Roxane encontra um jammer no carro de Bart e conta-lhe tudo; discutem e reconciliam; Melissa rapta David; Aurore alerta para possível ADN por ordem judicial. Sara quer que Roxane fuja; Roxane prefere confessar; Melissa hackeia semáforos e retém David; Roxane vai à esquadra; David aparece ferido, diz que matou Aurélie e incrimina Melissa. A versão dele afasta a investigação de Roxane; Aurore diz-lhe que ele está muito doente; Lisa ainda quer ADN dos restos de Melissa; Aurore pede a Roxane e Sara que troquem as amostras no laboratório. A troca resulta: o perfil bate certo com Aurélie, o inquérito encerra-se; com Aurore, Roxane fica a salvo de vez.",
    de: "Katastrophen-Storyline 💥\n\nZu Weihnachten schenkt Roxane Sara Flugunterricht; das Touristenflugzeug stürzt am Strand von Sète ab. Sara wird schwer verletzt und ins künstliche Koma versetzt. Manon, Jack, Sylvain und weitere werden verletzt; Pilot Jean-Charles Leduc stirbt. Georges erfährt von einer gehackten Drohne, die das Flugzeug zum Absturz brachte — Verbindung zu Psychose · Crash und Roxanes Vergangenheit als Aurélie Doumergue.\n\nEpisode für Episode: Die Geburtsstation wird gehackt, der Strom fällt aus; Roxane führt es auf Melissa; Aurore fürchtet, Roxane könnte ins Visier genommen werden. Roxane mahnt Melissa ab; Aurore kommt und Melissa entkommt. Lisa hält Roxane für die Hackerin; Melissa blendet in der Wache die Pestmaske aus Aurélies Drohvideos ein. David ist zurück; Sara erwacht aus dem Koma. David wird vernommen; Aurore erfährt, dass Roxane ihn gesehen und verschwiegen hat — sie streiten; die Melissa-Falle greift nicht. Roxane gesteht Bart, dass sie Aurélie ist. Lisa bleibt bei Aurélie; Roxane findet einen Störsender in Barts Auto und gesteht alles; Streit und Versöhnung; Melissa entführt David; Aurore warnt vor gerichtlich angeordnetem DNA-Test. Sara will, dass Roxane flieht; Roxane will lieber gestehen; Melissa hackt die Ampeln und hält David fest; Roxane geht zur Wache; ein verletzter David behauptet, Aurélie getötet zu haben, und belastet Melissa. Seine Aussage lenkt von Roxane ab; Aurore sagt Roxane, er sei schwer krank; Lisa will weiter DNA an Melissas Überresten; Aurore bittet Roxane und Sara, die Laborproben zu tauschen. Der Tausch klappt: das Profil passt zu Aurélie, der Fall wird eingestellt — mit Aurores Hilfe ist Roxane endgültig sicher."
  },

/** Muted lip underprint (slightly offset) behind white — reads on pink / orange cells */
const KISS_LIP_UNDERPRINT = "#8f8780";

function kissLipLayeredSvgFragment(offsetY) {
  const g0 = offsetY ? `<g transform="translate(0 ${offsetY})">` : "<g>";
  return `${g0}<path fill="${KISS_LIP_UNDERPRINT}" transform="translate(2.1 2.4)" d="${KISS_LIP_PATH}"/><path fill="#ffffff" d="${KISS_LIP_PATH}"/></g>`;
}

/** Twemoji-style kiss mark (SVGRepo): white lips on episode cells; dark lips in page legend (cream background). */
function kissCoupleSvgHtml(variant) {
  let classes = "appear-cell__kiss-svg appear-cell__kiss-svg--twemoji";
  if (variant === "small") classes += " appear-cell__kiss-svg--small";
  else if (variant === "legend") classes += " appear-cell__kiss-svg--legend";
  const lipFill = variant === "legend" ? "#2c2824" : "#ffffff";
  if (variant === "legend") {
    return `<svg class="${classes}" viewBox="-3.6 -3.6 43.2 43.2" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" preserveAspectRatio="xMidYMid meet" fill="none" aria-hidden="true" focusable="false" style="background:transparent"><path fill="${lipFill}" d="${KISS_LIP_PATH}"/></svg>`;
  }
  return `<svg class="${classes}" viewBox="-3.6 -3.6 43.2 43.2" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" preserveAspectRatio="xMidYMid meet" fill="none" aria-hidden="true" focusable="false" style="background:transparent">${kissLipLayeredSvgFragment(0)}</svg>`;
}

/** Two kisses: grey underprint + white per mark, tighter vertical step so they read stacked / overlapping. */
function kissCoupleSvgDoubleHtml() {
  return `<svg class="appear-cell__kiss-svg appear-cell__kiss-svg--twemoji appear-cell__kiss-svg--double" viewBox="-3.6 -2 43.2 87" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" preserveAspectRatio="xMidYMid meet" fill="none" aria-hidden="true" focusable="false" style="background:transparent">${kissLipLayeredSvgFragment(0)}${kissLipLayeredSvgFragment(32)}</svg>`;
}

function appearKissInnerHtml(ep) {
  const count = kissCountForEp(ep);
  if (count === 0) return "";
  if (count === 1) {
    return `<span class="appear-cell__kiss" aria-hidden="true">${kissCoupleSvgHtml()}</span>`;
  }
  if (count === 2) {
    return `<span class="appear-cell__kiss" aria-hidden="true">${kissCoupleSvgDoubleHtml()}</span>`;
  }
  const lines = Array.from({ length: count }, () =>
    `<span class="appear-cell__kiss-line appear-cell__kiss" aria-hidden="true">${kissCoupleSvgHtml("small")}</span>`
  ).join("");
  return `<span class="appear-cell__kiss appear-cell__kiss--stacked" aria-hidden="true">${lines}</span>`;
}

    appearancesLegendKiss: "Beijo"
  },
  de: {
    title: "Die Roxara-Linie",
    brand: "ROXARA",
    strap: "Storyline-U-Bahn-Linie",
    mapTitle: "Alle ihre Storylines und Meilensteine in chronologischer Reihenfolge",
    season: "Staffel",
    terminus: "Station",
    milestone: "Meilenstein",
    epPrefix: "Ep.",
    pillRoxane: "Roxane Hauptrolle",
    pillSara: "Sara Hauptrolle",
    pillBoth: "Roxane + Sara Hauptrollen",
    legendTitle: "Legende",
    legendStations: "Stationen (Storylines)",
    legendSubstop: "Keine Hauptrolle",
    legendInterchanges: "Meilensteine",
    legendSeasons: "Linien",
    legendToggleExpand: "Legende einblenden",
    legendToggleCollapse: "Legende ausblenden",
    sourceLabel: "Quelle:",
    sourceLinkText: "Wiki Demain nous appartient",
    watchTf1Link: "Roxara auf TF1 ansehen",
    langLabel: "Sprache",
    m_firstMeeting: "Erstes Treffen",
    m_dating: "Offizielle Beziehung",
    m_engagement: "Verlobung",
    m_wedding: "Hochzeit",
    m_enora: "Enora",
    readMoreOpenBtn: "Mehr",
    readMoreCloseBtn: "Schließen",
    appearancesTitle: "Auftritte nach Folge",
    appearancesRowSara: "Sara",
    appearancesRowRoxane: "Roxane",
    appearancesLegendOnSara: "Sara zu sehen",
    appearancesLegendOnRoxane: "Roxane zu sehen",
    appearancesLegendOff: "Nicht zu sehen",
    appearancesLegendKiss: "Kuss"
  }
};

const STORAGE_KEY = "dna-arcs-metro-lang";
let currentLang = (typeof localStorage !== "undefined" && localStorage.getItem(STORAGE_KEY)) || "fr";
if (!TRANSLATIONS[currentLang]) currentLang = "fr";

function t() { return TRANSLATIONS[currentLang]; }
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
}
function pillLabel(status) {
  const tr = t();
  return status === 1 ? tr.pillRoxane : status === 2 ? tr.pillSara : status === 3 ? tr.pillBoth : "";
}
function arcEpRange(arc) {
  const m = String(arc[3]).match(/(\d+)\s*(?:à|→|–|-)\s*(\d+)/) || String(arc[3]).match(/^(\d+)$/);
  if (!m) return null;
  const start = parseInt(m[1], 10);
  const end = m[2] ? parseInt(m[2], 10) : start;
  return [start, end];
}

/** Appearance matrix in Read more: show whenever we have per-episode appearance rows for this arc key. */
function shouldShowAppearancesInReadMore(key) {
  const rows = ARC_EP_APPEARANCES[key];
  if (!rows || !rows.length) return false;
  return !!ARCS.find((a) => `${a[0]}-${a[1]}` === key);
}

function eventTitle(ev) {
  const L = ev.labels || {};
  return L[currentLang] || L.en || L.fr || "";
}

function arcEventEmoji(ev) {
  const e = ev.emoji;
  if (typeof e === "string" && e.trim().length > 0) return e.trim();
  return "\u26A0\uFE0F";
}

function synopsisText(key) {
  const row = ARC_SYNOPSES[key];
  if (!row) return "";
  return row[currentLang] || row.fr || "";
}

function arcHasReadMore(key) {
  return !!(synopsisText(key) || shouldShowAppearancesInReadMore(key));
}

function renderAppearancesHtml(key) {
  const rows = ARC_EP_APPEARANCES[key];
  if (!rows || !rows.length) return "";
  const tr = t();
  const cols = rows.length;
  const showKissLegend = rows.some(({ ep, sara, roxane }) => kissCountForEp(ep) > 0 && (!!sara || !!roxane));
  let html = `<section class="appear-section">`;
  html += `<h3 class="appear-section-title">${escapeHtml(tr.appearancesTitle)}</h3>`;
  html += `<div class="appear-scroll"><div class="appear-grid" style="--appear-cols: ${cols}">`;
  html += `<span class="appear-corner"></span>`;
  rows.forEach(({ ep }) => {
    html += `<span class="appear-ep-head">${ep}</span>`;
  });
  html += `<span class="appear-row-label appear-row-label--sara">${escapeHtml(tr.appearancesRowSara)}</span>`;
  rows.forEach(({ ep, sara }) => {
    const on = !!sara;
    const kissCount = on ? kissCountForEp(ep) : 0;
    const kissNote = kissCount > 0
      ? " · " + tr.appearancesLegendKiss + (kissCount > 1 ? " (\u00d7" + kissCount + ")" : "")
      : "";
    const title = `${ep} · ${tr.appearancesRowSara} · ${on ? tr.appearancesLegendOnSara : tr.appearancesLegendOff}${kissNote}`;
    const kissHtml = kissCount > 0 ? appearKissInnerHtml(ep) : "";
    html += `<span class="appear-cell ${on ? "appear-cell--on appear-cell--sara" : "appear-cell--off"}" role="img" aria-label="${escapeHtml(title)}">${kissHtml}</span>`;
  });
  html += `<span class="appear-row-label appear-row-label--roxane">${escapeHtml(tr.appearancesRowRoxane)}</span>`;
  rows.forEach(({ ep, roxane }) => {
    const on = !!roxane;
    const kissCount = on ? kissCountForEp(ep) : 0;
    const kissNote = kissCount > 0
      ? " · " + tr.appearancesLegendKiss + (kissCount > 1 ? " (\u00d7" + kissCount + ")" : "")
      : "";
    const title = `${ep} · ${tr.appearancesRowRoxane} · ${on ? tr.appearancesLegendOnRoxane : tr.appearancesLegendOff}${kissNote}`;
    const kissHtml = kissCount > 0 ? appearKissInnerHtml(ep) : "";
    html += `<span class="appear-cell ${on ? "appear-cell--on appear-cell--roxane" : "appear-cell--off"}" role="img" aria-label="${escapeHtml(title)}">${kissHtml}</span>`;
  });
  html += `</div></div>`;
  html += `<div class="appear-legend">`;
  html += `<span class="appear-legend-item"><span class="appear-swatch appear-swatch--on-sara" aria-hidden="true"></span>${escapeHtml(tr.appearancesLegendOnSara)}</span>`;
  html += `<span class="appear-legend-item"><span class="appear-swatch appear-swatch--on-roxane" aria-hidden="true"></span>${escapeHtml(tr.appearancesLegendOnRoxane)}</span>`;
  html += `<span class="appear-legend-item"><span class="appear-swatch appear-swatch--off" aria-hidden="true"></span>${escapeHtml(tr.appearancesLegendOff)}</span>`;
  if (showKissLegend) {
    html += `<span class="appear-legend-item"><span class="appear-legend-kiss" aria-hidden="true">${kissCoupleSvgHtml("legend")}</span>${escapeHtml(tr.appearancesLegendKiss)}</span>`;
  }
  html += `</div></section>`;
  return html;
}

function openSynopsisModal(key, arcTitle) {
  if (!arcHasReadMore(key)) return;
  const tr = t();
  const modal = document.getElementById("synopsis-modal");
  modal.dataset.synopsisKey = key;
  modal.dataset.synopsisTitle = arcTitle;
  document.getElementById("synopsis-sheet-title").textContent = arcTitle;
  const blurbEl = document.getElementById("synopsis-blurb");
  const syn = synopsisText(key);
  blurbEl.textContent = syn;
  document.getElementById("synopsis-extra").innerHTML = shouldShowAppearancesInReadMore(key) ? renderAppearancesHtml(key) : "";
  document.getElementById("synopsis-close").textContent = tr.readMoreCloseBtn;
  modal.hidden = false;
  modal.setAttribute("aria-hidden", "false");
  document.body.style.overflow = "hidden";
}

function closeSynopsisModal() {
  const modal = document.getElementById("synopsis-modal");
  modal.hidden = true;
  modal.setAttribute("aria-hidden", "true");
  delete modal.dataset.synopsisKey;
  delete modal.dataset.synopsisTitle;
  document.getElementById("synopsis-blurb").textContent = "";
  document.getElementById("synopsis-extra").innerHTML = "";
  document.body.style.overflow = "";
}

function renderHeader() {
  const tr = t();
  document.documentElement.lang = currentLang;
  document.title = tr.title;
  document.getElementById("brand-name").textContent = tr.brand;
  document.getElementById("brand-strap").textContent = tr.strap;
  document.getElementById("lang-label").textContent = tr.langLabel;
  document.getElementById("map-title").textContent = tr.mapTitle;
  document.getElementById("legend-title").textContent = tr.legendTitle;
  updateToggleLabel();
  document.getElementById("synopsis-close").textContent = tr.readMoreCloseBtn;
  const synModal = document.getElementById("synopsis-modal");
  if (!synModal.hidden && synModal.dataset.synopsisKey) {
    const key = synModal.dataset.synopsisKey;
    document.getElementById("synopsis-blurb").textContent = synopsisText(key);
    document.getElementById("synopsis-extra").innerHTML = shouldShowAppearancesInReadMore(key) ? renderAppearancesHtml(key) : "";
    document.getElementById("synopsis-sheet-title").textContent = synModal.dataset.synopsisTitle || "";
  }
  document.getElementById("footer").innerHTML =
    `<div class="footer-line">${escapeHtml(tr.sourceLabel)} <a href="https://demain-nous-appartient.fandom.com/fr/wiki/Demain_nous_appartient" target="_blank" rel="noopener">${escapeHtml(tr.sourceLinkText)}</a></div>` +
    `<div class="footer-line"><a href="https://www.tf1.fr/tf1/demain-nous-appartient" target="_blank" rel="noopener">${escapeHtml(tr.watchTf1Link)}</a></div>`;
}

function renderFloatingLegend() {
  const tr = t();
  const seasons = [...new Set(ARCS.map((a) => a[0]))].sort((a, b) => a - b);

  const stationsHtml = `
    <div class="legend-section">
      <div class="legend-section-title">${escapeHtml(tr.legendStations)}</div>
      <div class="legend-list">
        <div class="legend-item">
          <span class="legend-marker-cell"><span class="legend-tick"></span></span>
          <span>${escapeHtml(tr.legendSubstop)}</span>
        </div>
        <div class="legend-item" style="color: var(--roxane)">
          <span class="legend-marker-cell"><span class="legend-disc"></span></span>
          <span style="color: var(--ink)">${escapeHtml(tr.pillRoxane)}</span>
        </div>
        <div class="legend-item" style="color: var(--sara)">
          <span class="legend-marker-cell"><span class="legend-disc"></span></span>
          <span style="color: var(--ink)">${escapeHtml(tr.pillSara)}</span>
        </div>
        <div class="legend-item" style="color: var(--both)">
          <span class="legend-marker-cell"><span class="legend-disc"></span></span>
          <span style="color: var(--ink)">${escapeHtml(tr.pillBoth)}</span>
        </div>
      </div>
    </div>`;

  const milestoneHtml = `
    <div class="legend-section">
      <div class="legend-section-title">${escapeHtml(tr.legendInterchanges)}</div>
      <div class="legend-list">
        ${MILESTONES.map((m) => {
          const label = tr["m_" + m.id] || m.id;
          return `
            <div class="legend-item">
              <span class="legend-marker-cell"><span class="legend-icon" style="--mi: ${m.color}">${m.symbol}</span></span>
              <span>
                <span style="color: var(--ink)">${escapeHtml(label)}</span>
                <span class="legend-meta">${escapeHtml(m.date)} · ${escapeHtml(tr.epPrefix)} ${m.ep}</span>
              </span>
            </div>`;
        }).join("")}
      </div>
    </div>`;

  const seasonsHtml = `
    <div class="legend-section">
      <div class="legend-section-title">${escapeHtml(tr.legendSeasons)}</div>
      <div class="legend-list">
        ${seasons.map((s) => {
          const arcs = ARCS.filter((a) => a[0] === s);
          return `
            <div class="legend-item" style="color: ${SEASON_COLORS[s]}">
              <span class="legend-marker-cell"><span class="legend-line-badge"><span>${s}</span></span></span>
              <span>
                <span style="color: var(--ink)">${escapeHtml(tr.season)} ${s}</span>
                <span class="legend-meta">${escapeHtml(arcs[0][4])} → ${escapeHtml(arcs[arcs.length - 1][5])}</span>
              </span>
            </div>`;
        }).join("")}
      </div>
    </div>`;

  document.getElementById("legend-body").innerHTML = stationsHtml + milestoneHtml + seasonsHtml;
}

function updateToggleLabel() {
  const tr = t();
  const panel = document.getElementById("legend-panel");
  const btn = document.getElementById("legend-toggle");
  const collapsed = panel.classList.contains("is-collapsed");
  const label = collapsed ? tr.legendToggleExpand : tr.legendToggleCollapse;
  btn.setAttribute("aria-label", label);
  btn.setAttribute("title", label);
  btn.setAttribute("aria-expanded", String(!collapsed));
}

function renderMap() {
  const tr = t();
  const seasons = [...new Set(ARCS.map((a) => a[0]))].sort((a, b) => a - b);
  let html = "";
  seasons.forEach((s, sIdx) => {
    const arcs = ARCS.filter((a) => a[0] === s);
    const startDate = arcs[0][4];
    const endDate = arcs[arcs.length - 1][5];
    const bc = SEASON_COLORS[s];
    html += `
      <div class="season-banner" style="--bc: ${bc}">
        <div class="marker-cell">
          <span class="banner-badge"><span class="banner-badge-inner">${s}</span></span>
        </div>
        <div class="banner-info">
          <div class="banner-eyebrow">${escapeHtml(tr.terminus)}</div>
          <div class="banner-title">${escapeHtml(tr.season)} ${s}</div>
          <div class="banner-meta">${escapeHtml(startDate)} → ${escapeHtml(endDate)}</div>
        </div>
      </div>`;

    arcs.forEach((arc, aIdx) => {
      const [season, num, title, eps, start, end, url, status] = arc;
      const arcKey = `${season}-${num}`;
      const isFeatured = status === 4;
      const isHi = status >= 1 && status <= 3;
      const showStation = isHi || isFeatured;
      const role = isHi ? `var(--${status === 1 ? "roxane" : status === 2 ? "sara" : "both"})` : isFeatured ? bc : "";
      const markerCls = showStation ? "station-marker is-major" : "station-marker";
      const markerStyle = showStation ? `--role: ${role};` : "";
      const isLastInSeason = aIdx === arcs.length - 1;
      const isLast = sIdx === seasons.length - 1 && isLastInSeason;
      const rowCls = (isLast ? "row row-last" : "row") + (showStation ? "" : " is-substop");
      const pill = isHi ? `<span class="role-badge" style="background: ${role}">${escapeHtml(pillLabel(status))}</span>` : "";
      const synKey = arcKey;
      const synBtn = arcHasReadMore(synKey)
        ? `<button type="button" class="readmore-chip" data-synopsis-key="${escapeHtml(synKey)}" data-synopsis-title="${escapeHtml(title)}">${escapeHtml(tr.readMoreOpenBtn)}</button>`
        : "";
      const metaLine = `${escapeHtml(start)} → ${escapeHtml(end)} · ${escapeHtml(tr.epPrefix)} ${escapeHtml(eps)}`;
      const metaBlock = synBtn
        ? `<div class="station-foot"><span class="station-meta">${metaLine}</span>${synBtn}</div>`
        : `<div class="station-meta station-meta--block">${metaLine}</div>`;
      const range = arcEpRange(arc);
      const arcNotesHtml =
        range && ARC_EVENTS.some((e) => e.ep >= range[0] && e.ep <= range[1])
          ? ARC_EVENTS.filter((e) => e.ep >= range[0] && e.ep <= range[1])
              .sort((a, b) => a.ep - b.ep)
              .map(
                (e) =>
                  `<div class="arc-event-note"><span class="arc-event-note-emoji" aria-hidden="true">${escapeHtml(arcEventEmoji(e))}</span>${escapeHtml(eventTitle(e))}<span class="arc-event-note-ep"> · ${escapeHtml(tr.epPrefix)} ${e.ep}</span></div>`
              )
              .join("")
          : "";

      html += `
        <div class="${rowCls}" style="--bc: ${bc}">
          <div class="marker-cell">
            <span class="${markerCls}" style="${markerStyle}"></span>
          </div>
          <div class="station-info">
            <span class="station-id">${num}</span>
            <a class="station-name" href="${url}" target="_blank" rel="noopener">${escapeHtml(title)}</a>
            ${pill}
            ${metaBlock}
            ${arcNotesHtml}
          </div>
        </div>`;

      if (range) {
        const inside = MILESTONES.filter((m) => m.ep >= range[0] && m.ep <= range[1]);
        inside.forEach((m) => {
          const label = tr["m_" + m.id] || m.id;
          html += `
            <div class="interchange" style="--bc: ${bc}; --mc: ${m.color}">
              <div class="marker-cell">
                <span class="interchange-marker">${m.symbol}</span>
              </div>
              <div class="interchange-info">
                <div class="interchange-eyebrow">${escapeHtml(tr.milestone)}</div>
                <div class="interchange-title">${escapeHtml(label)}</div>
                <div class="interchange-meta">${escapeHtml(m.date)} · ${escapeHtml(tr.epPrefix)} ${m.ep}</div>
              </div>
            </div>`;
        });
      }
    });
  });
  document.getElementById("map").innerHTML = html;
}

function renderAll() {
  renderHeader();
  renderFloatingLegend();
  renderMap();
}

const LEGEND_KEY = "dna-arcs-metro-legend-collapsed";
const legendPanel = document.getElementById("legend-panel");
const legendToggle = document.getElementById("legend-toggle");
let legendCollapsed = false;
try { legendCollapsed = localStorage.getItem(LEGEND_KEY) === "1"; } catch (_) {}
if (legendCollapsed) legendPanel.classList.add("is-collapsed");
legendToggle.addEventListener("click", () => {
  legendPanel.classList.toggle("is-collapsed");
  const collapsed = legendPanel.classList.contains("is-collapsed");
  try { localStorage.setItem(LEGEND_KEY, collapsed ? "1" : "0"); } catch (_) {}
  updateToggleLabel();
});

const langSelect = document.getElementById("lang");
langSelect.value = currentLang;
langSelect.addEventListener("change", (e) => {
  currentLang = e.target.value;
  try { localStorage.setItem(STORAGE_KEY, currentLang); } catch (_) {}
  closeSynopsisModal();
  renderAll();
});

document.getElementById("map").addEventListener("click", (e) => {
  const btn = e.target.closest(".readmore-chip");
  if (!btn || !document.getElementById("map").contains(btn)) return;
  e.preventDefault();
  const key = btn.getAttribute("data-synopsis-key");
  const arcTitle = btn.getAttribute("data-synopsis-title") || "";
  if (key) openSynopsisModal(key, arcTitle);
});

document.getElementById("synopsis-close").addEventListener("click", closeSynopsisModal);
document.getElementById("synopsis-backdrop").addEventListener("click", closeSynopsisModal);
document.addEventListener("keydown", (e) => {
  if (e.key !== "Escape") return;
  const modal = document.getElementById("synopsis-modal");
  if (!modal.hidden) closeSynopsisModal();
});

renderAll();
</script>
